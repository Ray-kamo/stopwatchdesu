<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ストップウォッチ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div id="display" class="timer-display">00:00:00:00</div>
    <div class="controls">
      <button id="btnStart" class="btn start">開始</button>
      <button id="btnStop" class="btn stop" disabled>停止</button>
      <button id="btnReset" class="btn reset" disabled>リセット</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
